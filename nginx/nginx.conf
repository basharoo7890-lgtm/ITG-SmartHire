# ============================================================
# nginx/nginx.conf — Reverse Proxy for ITG-SmartHire
# ============================================================
# Mode 1 (Default): HTTP only — for development & testing
# Mode 2 (Production): HTTPS with SSL certificates
#   → To enable SSL: place cert.pem and key.pem in ./nginx/ssl/
#   → Then uncomment the HTTPS server block below
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream: The ASP.NET Core container
    upstream smarthire_app {
        server app:8080;
        keepalive 32;
    }

    # ---- HTTP Server (Default — works without SSL) ----
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # File upload limit (CV files up to 10MB)
        client_max_body_size 10M;

        # Proxy to ASP.NET Core
        location / {
            proxy_pass         http://smarthire_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }

    # ============================================================
    # ---- HTTPS Server (Production) ----
    # لتفعيل HTTPS:
    #   1. ضع شهادات SSL في مجلد ./nginx/ssl/
    #      - cert.pem (الشهادة)
    #      - key.pem (المفتاح الخاص)
    #   2. أزل علامات التعليق (#) من الكود أدناه
    #   3. غيّر your-domain.com إلى اسم دومينك الحقيقي
    #   4. أعد تشغيل: docker-compose restart nginx

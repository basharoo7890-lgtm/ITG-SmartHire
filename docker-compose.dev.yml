# ============================================================
# docker-compose.dev.yml — DEVELOPMENT environment
# ============================================================
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build
#
# Features:
#   - SQL Server 2022 container (no need to install locally)
#   - Hot Reload via dotnet watch
#   - Source code mounted as volume
#   - Environment variables via .env file
# ============================================================

services:

  # ---- MySQL ----
  mysql:
    image: mysql:8.0
    container_name: smarthire_mysql_dev
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-Dev@Str0ngP@ssw0rd!}"
      MYSQL_DATABASE: "Employment"
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smarthire_dev_net

  # ---- ASP.NET Core App (Development with Hot Reload) ----
  app:
    build:
      context: ./Employment
      dockerfile: Dockerfile.dev
    container_name: smarthire_app_dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      # Connection string pointing to the MySQL container
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=Employment;Uid=root;Pwd=${DB_PASSWORD:-Dev@Str0ngP@ssw0rd!};"
      # AI API key — override here or in your .env file
      GeminiApiKey: "${GeminiApiKey:-your-openrouter-api-key-here}"
      # --- Seed Accounts ---
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-System Admin}"
      HR_EMAIL: "${HR_EMAIL:-}"
      HR_PASSWORD: "${HR_PASSWORD:-}"
      HR_NAME: "${HR_NAME:-HR Manager}"
    ports:
      - "8080:8080"
    volumes:
      # Mount source code for Hot Reload — changes are reflected instantly
      - ./Employment:/app
      # Exclude Windows-compiled bin/obj — let the container use its own
      - /app/bin
      - /app/obj
      # Persist NuGet packages cache to avoid re-downloading on each restart
      - nuget_cache:/root/.nuget/packages
      # Persist uploaded CVs
      - cv_uploads_dev:/app/wwwroot/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smarthire_dev_net
    restart: unless-stopped

volumes:
  mysql_dev_data:
  nuget_cache:
  cv_uploads_dev:

networks:
  smarthire_dev_net:
    driver: bridge

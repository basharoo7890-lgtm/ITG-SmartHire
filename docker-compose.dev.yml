# ============================================================
# docker-compose.dev.yml — DEVELOPMENT environment
# ============================================================
# Usage:
#   docker-compose -f docker-compose.dev.yml up --build
#
# Features:
#   - SQL Server 2022 container (no need to install locally)
#   - Hot Reload via dotnet watch
#   - Source code mounted as volume
#   - Environment variables via .env file
# ============================================================

services:

  # ---- SQL Server ----
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smarthire_sqlserver_dev
    platform: linux/amd64
    environment:
      # يتم جلب الباسورد من ملف .env وإن لم يتوفر يستخدم القيمة الافتراضية
      SA_PASSWORD: "${DB_PASSWORD:-Dev@Str0ngP@ssw0rd!}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_dev_data:/var/opt/mssql
    healthcheck:
      # نستخدم المتغير $$SA_PASSWORD لكي يقرأه من بيئة الحاوية مباشرة بدلاً من كتابته صراحة
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 15s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - smarthire_dev_net

  # ---- ASP.NET Core App (Development with Hot Reload) ----
  app:
    build:
      context: ./Employment
      dockerfile: Dockerfile.dev
    container_name: smarthire_app_dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      # Connection string pointing to the SQL Server container
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Employment;User Id=sa;Password=${DB_PASSWORD:-Dev@Str0ngP@ssw0rd!};TrustServerCertificate=True;"
      # AI API key — override here or in your .env file
      GeminiApiKey: "${GEMINI_API_KEY:-your-openrouter-api-key-here}"
    ports:
      - "8080:8080"
    volumes:
      # Mount source code for Hot Reload — changes are reflected instantly
      - ./Employment:/app
      # Persist NuGet packages cache to avoid re-downloading on each restart
      - nuget_cache:/root/.nuget/packages
      # Persist uploaded CVs
      - cv_uploads_dev:/app/wwwroot/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - smarthire_dev_net
    restart: unless-stopped

volumes:
  sqlserver_dev_data:
  nuget_cache:
  cv_uploads_dev:

networks:
  smarthire_dev_net:
    driver: bridge

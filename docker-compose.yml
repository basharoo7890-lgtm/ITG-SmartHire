# ============================================================
# docker-compose.yml — PRODUCTION environment
# ============================================================
# Usage:
#   1. Create a .env file with real credentials (see Employment/.env.example)
#   2. docker-compose up -d --build
#
# Architecture:
#   nginx (reverse proxy + SSL) → app (ASP.NET Core) → sqlserver
# ============================================================

services:

  # ---- MySQL ----
  mysql:
    image: mysql:8.0
    container_name: smarthire_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?❌ DB_PASSWORD is required. Set it in .env file}"
      MYSQL_DATABASE: "Employment"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smarthire_internal
    restart: unless-stopped

  # ---- ASP.NET Core Application ----
  app:
    build:
      context: ./Employment
      dockerfile: Dockerfile
      target: final
    image: smarthire-app:latest
    container_name: smarthire_app
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_RUNNING_IN_CONTAINER: "true"
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=Employment;Uid=root;Pwd=${DB_PASSWORD:?❌ DB_PASSWORD is required};"
      GeminiApiKey: "${GeminiApiKey:?❌ GeminiApiKey is required. Set it in .env file}"
      # --- Seed Accounts (auto-created on first startup) ---
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-System Admin}"
      HR_EMAIL: "${HR_EMAIL:-}"
      HR_PASSWORD: "${HR_PASSWORD:-}"
      HR_NAME: "${HR_NAME:-HR Manager}"
    volumes:
      # CV uploads persist across deployments — backup this volume regularly!
      - cv_uploads:/app/wwwroot/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smarthire_internal
      - smarthire_public
    restart: unless-stopped

  # ---- Nginx Reverse Proxy ----
  # Handles: reverse proxy, compression, security headers
  # For HTTPS: uncomment the SSL block in nginx.conf and add ssl volume below
  nginx:
    image: nginx:1.27-alpine
    container_name: smarthire_nginx
    ports:
      - "80:80"
      # - "443:443"  # ← Uncomment when SSL is configured
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro  # ← Uncomment when SSL certificates are placed
    depends_on:
      - app
    networks:
      - smarthire_public
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  cv_uploads:
    driver: local

networks:
  # Internal: SQL Server only reachable by the app
  smarthire_internal:
    driver: bridge
    internal: true
  # Public: Nginx ↔ App
  smarthire_public:
    driver: bridge
